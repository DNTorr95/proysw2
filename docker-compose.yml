# Proyecto 25 - Sistema Web de Gestión Administrativa con RPA
# Un contenedor por servicio. Solo nginx (80) y la interfaz de MailHog (8025, desarrollo)
# se publican al host; el resto vive en la red interna "interna".

name: proyecto25

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: America/La_Paz
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [interna]

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRACION_HORAS: ${JWT_EXPIRACION_HORAS:-8}
      SERVICE_KEY: ${SERVICE_KEY}
      CORS_ORIGENES: ${CORS_ORIGENES}
      RPA_URL: http://rpa-worker:8000
      IA_URL: http://servicios-ia:8000
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_AUTH: ${MAIL_AUTH:-false}
      MAIL_REMITENTE: ${MAIL_REMITENTE:-direccion.psicologia@ejemplo.edu.bo}
      STORAGE_DIR: /var/storage/documentos
      TZ: America/La_Paz
    volumes:
      - documentos:/var/storage/documentos
    networks: [interna]

  # Trabajador RPA: SIN credenciales de base de datos. Solo recibe datos del backend.
  rpa-worker:
    build: ./rpa-worker
    restart: unless-stopped
    environment:
      SERVICE_KEY: ${SERVICE_KEY}
      STORAGE_DIR: /var/storage/documentos
      TZ: America/La_Paz
    volumes:
      - documentos:/var/storage/documentos
    networks: [interna]

  # Servicios inteligentes (OCR, búsqueda, predicción, asistente): SIN credenciales de base de datos.
  servicios-ia:
    build: ./servicios-ia
    restart: unless-stopped
    environment:
      SERVICE_KEY: ${SERVICE_KEY}
      STORAGE_DIR: /var/storage/documentos
      TZ: America/La_Paz
    volumes:
      - documentos:/var/storage/documentos:ro
      - modelos-ia:/var/lib/modelos-ia        # modelos predictivos versionados (persisten entre reinicios)
    networks: [interna]

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"   # interfaz web de MailHog (solo desarrollo)
    networks: [interna]

  # Nginx sirve el frontend compilado y hace de proxy inverso hacia /api
  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "${HTTP_PORT:-80}:80"
    networks: [interna]

volumes:
  pgdata:
  documentos:
  modelos-ia:

networks:
  interna:
    driver: bridge
