# Nginx: sirve el frontend compilado y hace de proxy inverso hacia el backend (/api).
# Desarrollo: puerto 80. Producción: ver nginx.prod.conf (443 con TLS).
# Los servicios internos (rpa-worker, servicios-ia) NO se exponen por aquí.

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;   # adjuntos de hasta 10 MB

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 330s;   # ejecuciones RPA de hasta 5 minutos
    }

    # Las rutas internas nunca se publican
    location /interno/ {
        return 404;
    }

    # Archivos estáticos con caché larga (nombres con hash)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier otra ruta la resuelve React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
